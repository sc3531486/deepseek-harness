# Build DeepSeek Harness desktop artifacts on GitHub-hosted runners.
# Dispatch target: win-x64 (unsigned installer, needs no secrets), mac-arm64
# or mac-x64 (signed DMG and ZIP, needs the seven Apple signing secrets),
# or all. The Windows output is a local-test installer and cannot be released.
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop target to build
        type: choice
        required: true
        default: win-x64
        options:
          - win-x64
          - mac-arm64
          - mac-x64
          - all
      build_version:
        description: >-
          Optional build version extending the package version, for example
          0.2.0-rc.2-test.20261003.1. Empty publishes the package version.
        required: false
        default: ""

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  win-x64:
    if: inputs.target == 'win-x64' || inputs.target == 'all'
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Enable Windows Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Write local packaging settings
        shell: pwsh
        run: |
          $lines = @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness',
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test',
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://127.0.0.1',
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{""allowedAuthOrigins"":[""https://127.0.0.1""]}'"
          )
          $dir = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir '.env.windows') -Value ($lines -join "`r`n") -Encoding Ascii
          Get-Content (Join-Path $dir '.env.windows')

      - name: Install dependencies (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Package the desktop application
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          if ($env:BUILD_VERSION) {
            pnpm run package:desktop:win:x64:unsigned -- --build-version $env:BUILD_VERSION
          } else {
            pnpm run package:desktop:win:x64:unsigned
          }

      - name: List artifacts
        if: always()
        shell: pwsh
        run: |
          $out = 'apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts'
          if (Test-Path $out) { Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize }

      - name: Upload unsigned installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Upload packaging run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-run-logs-win-x64
          path: apps/desktop/.desktop-build/packaging-runs/
          retention-days: 7
          compression-level: 9

  mac-plan:
    if: inputs.target == 'mac-arm64' || inputs.target == 'mac-x64' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute the macOS matrix from the target input
        id: plan
        run: |
          case "${{ inputs.target }}" in
            mac-arm64) matrix='[{"target":"mac-arm64","runner":"macos-latest"}]' ;;
            mac-x64)   matrix='[{"target":"mac-x64","runner":"macos-15-intel"}]' ;;
            all)       matrix='[{"target":"mac-arm64","runner":"macos-latest"},{"target":"mac-x64","runner":"macos-15-intel"}]' ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mac:
    needs: mac-plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mac-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check the required macOS signing secrets
        shell: pwsh
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PWD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IDENTITY: ${{ secrets.DSH_DESKTOP_MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.DSH_DESKTOP_MACOS_TEAM_ID }}
        run: |
          $missing = @()
          foreach ($entry in @(
              @('CSC_LINK_BASE64', $env:CSC_LINK_B64),
              @('CSC_KEY_PASSWORD', $env:CSC_KEY_PWD),
              @('APPLE_API_KEY_BASE64', $env:APPLE_API_KEY_B64),
              @('APPLE_API_KEY_ID', $env:APPLE_API_KEY_ID),
              @('APPLE_API_ISSUER', $env:APPLE_API_ISSUER),
              @('DSH_DESKTOP_MACOS_SIGNING_IDENTITY', $env:IDENTITY),
              @('DSH_DESKTOP_MACOS_TEAM_ID', $env:TEAM_ID))) {
            $value = [string]$entry[1]
            if ($value.Trim() -eq '') { $missing += $entry[0] }
          }
          if ($missing.Count -gt 0) {
            throw "Missing repository secrets: $($missing -join ', '). Add all seven under Settings, Secrets and variables, Actions before building a macOS target."
          }

      - name: Write macOS packaging settings
        shell: pwsh
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PWD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IDENTITY: ${{ secrets.DSH_DESKTOP_MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.DSH_DESKTOP_MACOS_TEAM_ID }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'csc-link.p12'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String(($env:CSC_LINK_B64 -replace '\s', '')))
          $p8Path = Join-Path $env:RUNNER_TEMP 'apple-api-key.p8'
          [IO.File]::WriteAllBytes($p8Path, [Convert]::FromBase64String(($env:APPLE_API_KEY_B64 -replace '\s', '')))
          $lines = @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness',
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production',
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://127.0.0.1',
            'DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4',
            "DSH_DESKTOP_MACOS_SIGNING_IDENTITY=$env:IDENTITY",
            "DSH_DESKTOP_MACOS_TEAM_ID=$env:TEAM_ID",
            "CSC_LINK=$certPath",
            "CSC_KEY_PASSWORD=$env:CSC_KEY_PWD",
            "APPLE_API_KEY=$p8Path",
            "APPLE_API_KEY_ID=$env:APPLE_API_KEY_ID",
            "APPLE_API_ISSUER=$env:APPLE_API_ISSUER"
          )
          $path = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/.env.macos'
          Set-Content -Path $path -Value ($lines -join [Environment]::NewLine) -Encoding Ascii

      - name: Install dependencies (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Package the macOS application
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          if ($env:BUILD_VERSION) {
            pnpm run package:desktop:${{ matrix.target }} -- --build-version $env:BUILD_VERSION
          } else {
            pnpm run package:desktop:${{ matrix.target }}
          }

      - name: List artifacts
        if: always()
        shell: pwsh
        run: |
          $out = 'apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts'
          if (Test-Path $out) { Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize }

      - name: Upload the DMG and ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ matrix.target }}
          path: apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Upload packaging run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-run-logs-${{ matrix.target }}
          path: apps/desktop/.desktop-build/packaging-runs/
          retention-days: 7
          compression-level: 9
